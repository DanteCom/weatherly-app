name: weathery
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  flutter_gen_runner: ^5.13.0+1

flutter_gen:
  output: lib/shared/gen/
  integrations:
    image: true
    flutter_svg: true


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/

